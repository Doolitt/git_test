name: FLOWER Foundry CI

on:
  push:
    branches:
      - flower-economic-epochs
  workflow_dispatch:

concurrency:
  group: flower-economic-epochs-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd flower
          mkdir -p lib
          git clone --quiet --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --quiet --depth 1 --branch v4.1.2 https://github.com/PaulRBerg/prb-math.git lib/prb-math
          git clone --quiet --depth 1 --branch v1.12.0 https://github.com/foundry-rs/forge-std.git lib/forge-std

      - name: Toolchain versions
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Format ephemeral checkout
        working-directory: flower
        run: forge fmt

      - name: Build
        working-directory: flower
        run: forge build --sizes

      - name: Unit, fuzz, and invariant tests
        working-directory: flower
        run: forge test -vvv

      - name: Gas snapshot
        working-directory: flower
        run: forge snapshot
